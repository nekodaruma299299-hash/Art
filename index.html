'use strict';
// Artopia room transport TEST. PeerJS DataConnection + STUN only (NO TURN).
// Based on the Dream Crafter connection style: PeerJS handles offer/answer/ICE.
// This test explicitly overrides PeerJS's default ICE config so TURN cannot be used.
const ArtopiaNetwork = (() => {
  const PROTOCOL='artopia-rtc-1';
  const PEERJS_URL='https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js';
  const PEER_OPTIONS={
    debug:1,
    config:{
      iceServers:[{urls:'stun:stun.l.google.com:19302'}],
      sdpSemantics:'unified-plan'
    }
  };
  let libraryPromise=null;
  const fault=(type,message)=>Object.assign(new Error(message),{type});

  function roomId(code){
    let a=0x811c9dc5,b=0x9e3779b9;
    for(const ch of code){const n=ch.codePointAt(0);a=Math.imul(a^n,0x01000193);b=Math.imul(b^(n+a),0x85ebca6b)}
    return 'artopia7-'+(a>>>0).toString(36)+'-'+(b>>>0).toString(36);
  }

  function ensurePeerLibrary(){
    if(typeof Peer==='function')return Promise.resolve();
    if(libraryPromise)return libraryPromise;
    libraryPromise=new Promise((resolve,reject)=>{
      const script=document.createElement('script');
      script.src=PEERJS_URL;script.async=true;script.crossOrigin='anonymous';
      const timer=setTimeout(()=>{script.remove();libraryPromise=null;reject(fault('network','PeerJSの読み込みが時間切れになりました。'))},12000);
      script.onload=()=>{clearTimeout(timer);if(typeof Peer==='function')resolve();else{libraryPromise=null;reject(fault('network','PeerJSを開始できませんでした。'))}};
      script.onerror=()=>{clearTimeout(timer);script.remove();libraryPromise=null;reject(fault('network','PeerJSを読み込めませんでした。'))};
      document.head.appendChild(script);
    });
    return libraryPromise;
  }

  // Keep Artopia's diagnostics useful while letting PeerJS own negotiation.
  function decorateConnection(c){
    if(!c||c.__artopiaDecorated)return c;
    c.__artopiaDecorated=true;
    c.metrics={mode:'peerjs-stun-only'};
    // PeerJS exposes peerConnection/dataChannel; no custom candidate injection is done here.
    return c;
  }

  async function createPeer(id,onCreate=()=>{}){
    if(typeof RTCPeerConnection!=='function')throw fault('webrtc','このブラウザではオンライン接続を利用できません。');
    await ensurePeerLibrary();
    return new Promise((resolve,reject)=>{
      let settled=false,p;
      const options={...PEER_OPTIONS,config:{...PEER_OPTIONS.config,iceServers:PEER_OPTIONS.config.iceServers.map(x=>({...x}))}};
      try{p=id?new Peer(id,options):new Peer(options)}catch(e){reject(e);return}
      try{onCreate(p)}catch{}
      const timer=setTimeout(()=>{
        if(settled)return;settled=true;
        try{p.destroy()}catch{}
        reject(fault('network','部屋の登録が時間切れになりました。'));
      },12000);
      const ready=()=>{if(settled)return;settled=true;clearTimeout(timer);resolve(p)};
      const fail=e=>{if(settled)return;settled=true;clearTimeout(timer);try{p.destroy()}catch{};reject(e)};
      p.once('open',ready);p.once('error',fail);
      // Decorate every incoming connection before application handlers receive it.
      p.on('connection',decorateConnection);
    });
  }

  function attach(c,handlers={}){
    decorateConnection(c);
    for(const key of ['open','data','close','error'])if(handlers[key])c.on(key,handlers[key]);
    return c;
  }

  function connect(p,id){
    if(!p||p.destroyed||p.disconnected)throw fault('network','部屋への接続準備ができていません。');
    const c=p.connect(id,{reliable:true,serialization:'json',metadata:{protocol:PROTOCOL}});
    if(!c)throw fault('network','部屋への接続を開始できませんでした。');
    return decorateConnection(c);
  }

  return {roomId,createPeer,attach,connect};
})();

'use strict';
// One admission state machine for typed passphrases and invitation URLs.
const ArtopiaAdmission={
  normalize(value){return String(value??'').normalize('NFKC').replace(/[\u200B-\u200D\u2060\uFEFF]/g,'').trim().replace(/\s+/g,' ')},
  parse(value){
    let code=String(value??'').trim();
    if(/^https?:\/\//i.test(code)){
      let url;try{url=new URL(code)}catch{throw Error('招待URLを確認してください。')}
      code=new URLSearchParams(url.hash.slice(1)).get('room');
      if(code===null)throw Error('合言葉が含まれた招待URLを入力してください。');
    }
    return this.normalize(code);
  },
  invitation(code,base){const url=new URL(base);url.hash=new URLSearchParams({room:this.normalize(code)}).toString();return url.href},
  join(options){
    return new Promise((resolve,reject)=>{
      const o=options;let connection,alive=true,ready=false,loading=false,timer,helloTimer;
      const pending=[],deadline=Date.now()+120000;
      const current=()=>alive&&!o.signal.aborted&&o.isCurrent();
      const cleanup=()=>{clearTimeout(timer);clearInterval(helloTimer);o.signal.removeEventListener('abort',abort);o.peer.off('error',fail)};
      const fail=error=>{if(!alive||ready)return;alive=false;cleanup();connection?.close();reject(error)};
      const abort=()=>fail(new DOMException('接続を中止しました。','AbortError'));
      let phase='部屋主との接続';
      const stage=(name,text,ms=30000)=>{
        phase=name;clearTimeout(timer);o.onProgress(text);
        timer=setTimeout(()=>{
          o.onTimeout(phase,connection);
          fail(Object.assign(Error(`${phase}で時間切れになりました。「接続診断」で通信状況を確認できます。`),{type:'join-timeout'}));
        },Math.max(0,Math.min(ms,deadline-Date.now())));
      };
      const hello=()=>{if(current()&&!ready&&connection.open)o.send(connection,{type:'hello',profile:o.profile,spectator:o.spectator})};
      const receive=async message=>{
        if(!current())return;
        if(message.type==='reject'){fail(Error(message.message));return}
        if(message.type==='hostReady'){hello();return}
        if(message.type==='helloAck'){clearInterval(helloTimer);return}
        if(ready){o.onMessage(message);return}
        if(message.type==='welcomeStart'){
          clearInterval(helloTimer);stage('キャンバスの受信','④ キャンバスを受信しています…');return;
        }
        if(message.type==='welcomeProgress'){
          clearInterval(helloTimer);stage('キャンバスの受信',`④ キャンバスを受信しています… ${Math.floor(message.received/message.total*100)}%`);return;
        }
        if(message.type==='welcome'){
          if(loading)return;loading=true;clearInterval(helloTimer);
          stage('キャンバスの復元','⑤ キャンバスを開いています…');
          try{
            const prepared=await o.prepare(message);
            if(!current())return;
            o.commit(prepared,message);ready=true;cleanup();
            for(const item of pending)o.onMessage(item);pending.length=0;
            resolve(connection);
          }catch(error){fail(error)}
          return;
        }
        if(pending.length>=2000){fail(Error('入室中の更新が多すぎるため、もう一度入室してください。'));return}
        pending.push(message);
      };
      if(o.signal.aborted){abort();return}
      o.signal.addEventListener('abort',abort,{once:true});o.peer.on('error',fail);
      stage('部屋主との接続','② 部屋主との通信経路を確立しています…');
      try{connection=o.connect();o.onConnection(connection)}catch(error){fail(error);return}
      connection.on('open',()=>{
        if(!current())return;
        stage('参加受付','③ 部屋主に参加情報を送っています…',15000);
        hello();helloTimer=setInterval(hello,1000);
      });
      connection.on('data',packet=>{if(current())o.decode(connection,packet,receive)});
      connection.on('error',fail);
      connection.on('close',()=>{
        if(!current())return;
        if(!ready){fail(Object.assign(Error('部屋主との接続が閉じられました。'),{type:'connection-closed'}));return}
        alive=false;cleanup();o.onDisconnected();
      });
    });
  }
};

const wireQueues=new WeakMap();
function sendWire(conn,msg){
  if(!conn)return;
  let q=wireQueues.get(conn);
  if(!q){
    q={frames:[],index:0,timer:null,closed:false};wireQueues.set(conn,q);
    q.pump=()=>{
      clearTimeout(q.timer);q.timer=null;
      if(q.closed||!conn.open)return;
      let sent=0;
      try{
        while(q.index<q.frames.length&&sent<4){
          if((conn.dataChannel?.bufferedAmount||0)>131072)break;
          conn.send(q.frames[q.index++]);sent++;
        }
      }catch(e){q.closed=true;q.frames=[];conn.emit?.('error',e);return}
      if(q.index===q.frames.length){q.frames=[];q.index=0}
      else q.timer=setTimeout(q.pump,10);
    };
    conn.on('open',q.pump);
    conn.on('close',()=>{q.closed=true;clearTimeout(q.timer);q.frames=[]});
  }
  if(q.closed)return;
  const text=JSON.stringify(msg);
  if(text.length<4000)q.frames.push({...msg,protocol:'artopia-0'});
  else{const id=uid(),total=Math.ceil(text.length/4000);for(let i=0;i<total;i++)q.frames.push({protocol:'artopia-0',chunk:id,index:i,total,messageType:msg.type,text:text.slice(i*4000,(i+1)*4000)})}

function renderOverlay(){if(!engine)return;let c=$('#overlay'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);for(const a of remoteDrafts.values())if(Date.now()-a.received<7000&&a.tool==='pen')E.apply(c,a);if(stroke&&stroke.tool==='pen')E.apply(c,stroke);if(stroke&&stroke.tool==='eraser'){x.save();x.strokeStyle='#758591';x.lineWidth=1/prefs.view.z;let p=stroke.points.at(-1);x.beginPath();x.arc(p[0],p[1],stroke.size/2,0,Math.PI*2);x.stroke();x.restore()}for(const l of locks.values())if(l.owner!==localId){x.save();x.fillStyle='#e9a34215';x.strokeStyle='#d89a42';x.lineWidth=2/prefs.view.z;x.setLineDash([7/prefs.view.z,4/prefs.view.z]);x.fillRect(l.rect.x,l.rect.y,l.rect.w,l.rect.h);x.strokeRect(l.rect.x,l.rect.y,l.rect.w,l.rect.h);x.restore()}
if(selection){let temp=E.clone(engine.layers[prefs.layer]);E.apply(temp,{...selection,tool:'transform',layer:prefs.layer});let composite=E.make(engine.w,engine.h),cx=composite.getContext('2d');cx.fillStyle='white';cx.fillRect(0,0,engine.w,engine.h);engine.layers.forEach((l,i)=>{cx.globalAlpha=prefs.opacities[i]/100;cx.drawImage(i===prefs.layer?temp:l,0,0)});x.drawImage(composite,0,0);x.save();x.translate(selection.cx+selection.dx,selection.cy+selection.dy);x.rotate(selection.angle*Math.PI/180);x.scale(selection.scale*selection.flipX,selection.scale*selection.flipY);x.translate(-selection.cx,-selection.cy);x.beginPath();selection.points.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.closePath();x.setLineDash([6/prefs.view.z,4/prefs.view.z]);x.lineWidth=1.5/prefs.view.z/selection.scale;x.strokeStyle='#159ca6';x.stroke();x.restore()}else if(stroke?.tool==='lasso'){x.beginPath();stroke.points.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.lineWidth=1.5/prefs.view.z;x.setLineDash([5/prefs.view.z,4/prefs.view.z]);x.strokeStyle='#139aa3';x.stroke();x.setLineDash([])}}
function applyView(){if(!engine)return;let v=prefs.view;$('#canvasSurface').style.transform=`translate(${v.x}px,${v.y}px) rotate(${v.angle}rad) scale(${v.z})`;$('#zoomValue').textContent=Math.round(v.z*100)+'%';renderCursors()}
function fitView(){if(!engine)return;let r=$('#viewport').getBoundingClientRect(),z=Math.min((r.width-46)/engine.w,(r.height-55)/engine.h);z=Math.max(.03,z);prefs.view={x:(r.width-engine.w*z)/2,y:(r.height-30-engine.h*z)/2,z,angle:0};applyView()}
function point(e){let r=$('#viewport').getBoundingClientRect(),v=prefs.view,x=e.clientX-r.left-v.x,y=e.clientY-r.top-v.y,c=Math.cos(-v.angle),s=Math.sin(-v.angle);return[(x*c-y*s)/v.z,(x*s+y*c)/v.z,e.pointerType==='pen'?Math.max(.05,e.pressure||.5):.625]}
function renderCursors(){let el=$('#cursors');el.innerHTML='';if(!$('#cursorCheck').checked)return;for(const[id,c]of remoteCursors){let m=members.get(id);if(!m||Date.now()-c.at>10000)continue;let n=document.createElement('div');n.className='remote-cursor';n.style.left=c.x+'px';n.style.top=c.y+'px';n.style.transform=`scale(${1/prefs.view.z}) rotate(${-prefs.view.angle}rad)`;n.style.color=m.profile.color;n.innerHTML=`➤<span style="background:${m.profile.color}">${esc(m.profile.name)}</span>`;el.append(n)}}
$('#cursorCheck').onchange=renderCursors;
let pointers=new Map(),gesture=null,dragSelection=null,draftAt=0,effectPreviewAt=0,activePointer=null;
function gestureStart(){let arr=[...pointers.values()],r=$('#viewport').getBoundingClientRect();let cx=arr.reduce((s,p)=>s+p.x,0)/arr.length-r.left,cy=arr.reduce((s,p)=>s+p.y,0)/arr.length-r.top;gesture={view:structuredClone(prefs.view),cx,cy,d:arr.length>1?Math.hypot(arr[1].x-arr[0].x,arr[1].y-arr[0].y):0,a:arr.length>1?Math.atan2(arr[1].y-arr[0].y,arr[1].x-arr[0].x):0};if(!moveUndo)moveUndo=structuredClone(prefs.view)}
function gestureMove(){let arr=[...pointers.values()];if(!gesture||!arr.length)return;let r=$('#viewport').getBoundingClientRect(),cx=arr.reduce((s,p)=>s+p.x,0)/arr.length-r.left,cy=arr.reduce((s,p)=>s+p.y,0)/arr.length-r.top,g=gesture,v=g.view,z=v.z,ang=v.angle;if(arr.length>1&&g.d){z=Math.max(.03,Math.min(16,v.z*Math.hypot(arr[1].x-arr[0].x,arr[1].y-arr[0].y)/g.d));ang=v.angle+Math.atan2(arr[1].y-arr[0].y,arr[1].x-arr[0].x)-g.a}let ratio=z/v.z,da=ang-v.angle,dx=g.cx-v.x,dy=g.cy-v.y;prefs.view={x:cx-(dx*Math.cos(da)-dy*Math.sin(da))*ratio,y:cy-(dx*Math.sin(da)+dy*Math.cos(da))*ratio,z,angle:ang};applyView()}
const viewport=$('#viewport');
viewport.onpointerdown=e=>{if(e.target.closest('#transformBar'))return;e.preventDefault();viewport.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pan||(prefs.penOnly&&e.pointerType==='touch')||e.button===1){if(stroke){stroke=null;activePointer=null;renderOverlay()}gestureStart();return}if(pointers.size>1){return}if(!connected||members.get(localId)?.spectator){toast('観戦中、または接続が切れています');return}let p=point(e);if(p[0]<0||p[1]<0||p[0]>=engine.w||p[1]>=engine.h)return;activePointer=e.pointerId;if(selection){dragSelection={p,dx:selection.dx,dy:selection.dy};return}if(prefs.tool==='eyedrop'){let pixel=$('#display').getContext('2d').getImageData(Math.floor(p[0]),Math.floor(p[1]),1,1).data;changeSetting('color','#'+[...pixel.slice(0,3)].map(v=>v.toString(16).padStart(2,'0')).join(''));changeSetting('tool','pen');return}let t=currentTool();stroke={id:'draft',layer:prefs.layer,tool:prefs.tool,size:t.size,strength:t.strength,color:prefs.color,pressure:prefs.pressure&&e.pointerType==='pen',tolerance:prefs.tolerance,points:[p]};if(conflicts(localId,stroke)){stroke=null;toast('この範囲はほかの人が変形中です');return}if(stroke.tool==='fill'){commit(stroke);stroke=null}else renderOverlay()};
viewport.onpointermove=e=>{if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(gesture){gestureMove();return}let p=point(e);if(connected&&Date.now()-lastCursor>70){lastCursor=Date.now();sendHost({type:'cursor',x:p[0],y:p[1]})}if(e.pointerId!==activePointer)return;if(dragSelection&&selection){selection.dx=dragSelection.dx+p[0]-dragSelection.p[0];selection.dy=dragSelection.dy+p[1]-dragSelection.p[1];renderOverlay();return}if(!stroke)return;let prev=stroke.points.at(-1),s=stroke.tool==='pen'?1-prefs.smooth/100:1;p=[prev[0]+(p[0]-prev[0])*s,prev[1]+(p[1]-prev[1])*s,p[2]];let min=['warp','blur'].includes(stroke.tool)?Math.max(3,stroke.size/8):.6;if(Math.hypot(p[0]-prev[0],p[1]-prev[1])<min)return;if(stroke.points.length>=2999){finishStroke();return}stroke.points.push(p);if(['warp','blur'].includes(stroke.tool)){if(Date.now()-effectPreviewAt>90){effectPreviewAt=Date.now();let c=E.clone(engine.layers[stroke.layer]);E.apply(c,stroke);let x=$('#overlay').getContext('2d');x.fillStyle='white';x.fillRect(0,0,engine.w,engine.h);engine.layers.forEach((l,i)=>{x.globalAlpha=prefs.opacities[i]/100;x.drawImage(i===stroke.layer?c:l,0,0)});x.globalAlpha=1}}else renderOverlay();if(stroke.tool==='pen'&&Date.now()-draftAt>100){draftAt=Date.now();sendHost({type:'draft',op:stroke})}};
function finishStroke(){if(!stroke)return;let a=stroke;stroke=null;if(a.tool==='lasso'){if(a.points.length>2){let b=bounds(a);selection={points:a.points.map(p=>p.slice(0,2)),cx:b.x+b.w/2,cy:b.y+b.h/2,dx:0,dy:0,angle:0,scale:1,flipX:1,flipY:1};$('#transformBar').hidden=false;$('#rotateSelection').value=0;$('#scaleSelection').value=100;if(room.protect)sendHost({type:'lock',lock:{id:uid(),layer:prefs.layer,rect:b}})}}else if(a.tool!=='warp'||a.points.length>1)commit(a);renderOverlay()}
function pointerEnd(e,cancel=false){pointers.delete(e.pointerId);if(gesture){if(pointers.size)gestureStart();else{gesture=null;if(moveUndo){commitSetting('view',moveUndo,prefs.view);moveUndo=null}}return}if(e.pointerId===activePointer){if(cancel){stroke=null;renderOverlay()}else finishStroke();dragSelection=null;activePointer=null}}
viewport.onpointerup=e=>pointerEnd(e);viewport.onpointercancel=e=>pointerEnd(e,true);viewport.oncontextmenu=e=>e.preventDefault();
let wheelBefore=null,wheelTimer;viewport.addEventListener('wheel',e=>{if(!pan)return;e.preventDefault();if(!wheelBefore)wheelBefore=structuredClone(prefs.view);let r=viewport.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,v=prefs.view,z=Math.max(.03,Math.min(16,v.z*Math.exp(-e.deltaY*.002))),s=z/v.z;prefs.view={...v,x:x-(x-v.x)*s,y:y-(y-v.y)*s,z};applyView();clearTimeout(wheelTimer);wheelTimer=setTimeout(()=>{commitSetting('view',wheelBefore,prefs.view);wheelBefore=null},250)},{passive:false});
function cancelSelection(){selection=null;$('#transformBar').hidden=true;if(room&&connected)sendHost({type:'unlock'});renderOverlay()}
$('#cancelTransform').onclick=cancelSelection;$('#applyTransform').onclick=()=>{if(!selection)return;let op={...selection,tool:'transform',layer:prefs.layer};if(conflicts(localId,op)){toast('移動先に保護中の範囲があります');return}commit(op);cancelSelection()};$('#flipX').onclick=()=>{if(selection){selection.flipX*=-1;renderOverlay()}};$('#flipY').onclick=()=>{if(selection){selection.flipY*=-1;renderOverlay()}};$('#rotateSelection').oninput=e=>{if(selection){selection.angle=+e.target.value;renderOverlay()}};$('#scaleSelection').oninput=e=>{if(selection){selection.scale=+e.target.value/100;renderOverlay()}};
new ResizeObserver(()=>{if(engine&&!$('#studio').hidden)fitView()}).observe(viewport);
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||$('#modal').open||!room)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();(e.shiftKey?$('#redoBtn'):$('#undoBtn')).click()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();$('#redoBtn').click()}else if(e.key==='Escape'){if(selection)cancelSelection();else if(pan)changeSetting('pan',false)}else if(e.code==='Space'){e.preventDefault();if(!e.repeat)$('#panBtn').click()}});
$('#membersBtn').onclick=()=>$('#memberPanel').classList.toggle('open');
function addChat(m){if(chat.some(x=>x.id===m.id))return;chat.push(m);chat=chat.slice(-200);if($('#modal').open&&$('#chatList'))renderChat();else if(m.author!==localId)unread++;$('#unreadBadge').textContent=unread||'';if($('#flyCheck').checked){let n=document.createElement('div');n.className='flying';n.style.top=(10+(chat.length%5)*12)+'%';let b=document.createElement('b');b.style.color=m.color;b.textContent=m.name;n.append(b,document.createTextNode(m.text));$('#flyLayer').append(n);n.onanimationend=()=>n.remove()}}
function renderChat(){let el=$('#chatList');if(!el)return;el.innerHTML='';for(const m of chat){let n=document.createElement('div');n.className='chat-entry'+(m.author===localId?' self':'');n.innerHTML=`<header><b style="color:${esc(m.color)}">${esc(m.name)}</b><time>${new Date(m.at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</time></header><div>${esc(m.text)}</div>`;el.append(n)}el.scrollTop=el.scrollHeight}
function openChat(){modal('コメント',`<div id="chatList" class="chat-list"></div><form id="chatForm" class="chat-compose"><input id="chatInput" maxlength="180" autocomplete="off" placeholder="みんなにメッセージ" aria-label="コメント"><button class="primary">送信</button></form><p class="muted">最新200件 · 1件180文字まで</p>`);unread=0;$('#unreadBadge').textContent='';renderChat();$('#chatForm').onsubmit=e=>{e.preventDefault();let text=$('#chatInput').value.trim();if(!text||Date.now()-lastChat<700)return;lastChat=Date.now();sendHost({type:'chat',text});$('#chatInput').value=''}}
$('#chatBtn').onclick=$('#mobileChat').onclick=openChat;
$('#inviteBtn').onclick=()=>{modal('友だちを招待',`<p class="muted">「部屋に入る」で、この合言葉を入力してください。</p><div class="code-box">${esc(room.code)}</div><div class="modal-actions"><button id="copyCode">合言葉をコピー</button><button id="copyLink" class="primary">招待リンクをコピー</button></div>`);$('#copyCode').onclick=()=>copyText(room.code);$('#copyLink').onclick=()=>copyText(ArtopiaAdmission.invitation(room.code,location.href))};
async function copyText(s){try{await navigator.clipboard.writeText(s);toast('コピーしました')}catch{prompt('コピーしてください',s)}}
$('#snapshotBtn').onclick=()=>{if(!engine)return;modal('スナップショット',`<p class="muted">自分のレイヤー透明度を反映して、キャンバス全体を保存します。</p><label class="form-field">作品名<input id="snapshotName" maxlength="60" value="${esc(room.name)}"></label><div class="modal-actions"><button id="snapshotDownload">画像を書き出す</button><button id="snapshotSave" class="primary">絵画展に保存</button></div>`);$('#snapshotDownload').onclick=()=>download(engine.compose(prefs.opacities).toDataURL(),($('#snapshotName').value||'アートピア')+'.png');$('#snapshotSave').onclick=async()=>{try{$('#snapshotSave').disabled=true;await saveArt($('#snapshotName').value.trim()||room.name,engine.compose(prefs.opacities));$('#modal').close();toast('絵画展に保存しました')}catch{toast('保存できませんでした。画像を書き出してください。');$('#snapshotSave').disabled=false}}};
$('#roomSettingsBtn').onclick=()=>{modal('部屋設定',`<p><b>${esc(room.name)}</b></p><p class="muted">キャンバス：${engine.w} × ${engine.h} px<br>履歴：${room.history}分<br>人数上限：${room.limit}人<br>観戦：${room.spectate?'許可':'不可'}<br>変形中の範囲保護：${room.protect?'有効':'無効'}</p><p class="muted">キャンバスサイズなどは部屋作成時に設定します。</p><div class="modal-actions"><button id="roomDiagnostics">接続診断</button><button id="leaveSettings">${isHost?'保存して部屋を終了':'部屋を退出'}</button></div>`);$('#roomDiagnostics').onclick=showConnectionDiagnostics;$('#leaveSettings').onclick=leaveRoom};
async function leaveRoom(){if(!room)return;modal(isHost?'部屋を終了しますか？':'部屋を退出しますか？',`<p class="muted">${isHost?'現在の絵をあなたの絵画展に保存してから終了します。参加者との接続も終了します。':'保存していない絵は、退出する前に保存してください。'}</p><div class="modal-actions"><button id="cancelLeave">戻る</button><button id="confirmLeave" class="primary">${isHost?'保存して終了':'退出する'}</button></div>`);$('#cancelLeave').onclick=()=>$('#modal').close();$('#confirmLeave').onclick=async()=>{if(isHost){try{$('#confirmLeave').disabled=true;await saveArt(room.name,engine.compose(prefs.opacities),'room-'+room.id);await db('recovery','readwrite',s=>s.delete(profile.id))}catch{toast('作品を保存できませんでした。画像を書き出してから終了してください。');$('#confirmLeave').disabled=false;return}broadcast({type:'closing'})}setTimeout(()=>{resetSession();engine=null;$('#studio').hidden=true;$('#home').hidden=false;$('#modal').close();refreshGallery()},150)}}
$('#leaveBtn').onclick=leaveRoom;
window.addEventListener('beforeunload',e=>{if(room&&connected){e.preventDefault();e.returnValue=''}});
async function saveRecovery(){if(!isHost||!engine||!room)return;try{await db('recovery','readwrite',s=>s.put({id:profile.id,name:room.name,at:Date.now(),image:engine.compose(prefs.opacities).toDataURL()}))}catch{}}
setInterval(()=>{if(!room||!engine)return;if(isHost){let cutoff=Date.now()-room.history*60000;if(engine.compact(cutoff))broadcast({type:'compact',cutoff});let removed=false;for(const[id,l]of locks)if(Date.now()-l.at>120000){locks.delete(id);removed=true}if(removed)broadcastLocks();if(Date.now()-lastRecovery>20000){lastRecovery=Date.now();saveRecovery()}}if(selection&&connected&&room.protect){let owned=[...locks.values()].find(l=>l.owner===localId);if(owned&&Date.now()-owned.at>30000)sendHost({type:'lock',lock:{...owned,rect:bounds({...selection,tool:'transform',layer:prefs.layer})}})}for(const[id,a]of remoteDrafts)if(Date.now()-a.received>7000)remoteDrafts.delete(id);renderControls();renderCursors()},3000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveRecovery()});
async function init(){await refreshGallery();try{let saved=await db('recovery','readonly',s=>s.get(profile.id));if(saved){const im=await E.image(saved.image),c=E.make(im.width,im.height);c.getContext('2d').drawImage(im,0,0);await saveArt(saved.name+'（復元）',c,'recovery-'+profile.id);await db('recovery','readwrite',s=>s.delete(profile.id));toast('前回のキャンバスを絵画展に復元しました')}}catch{}updateHome();if(!profile.name)showProfile(true);else if(new URLSearchParams(location.hash.slice(1)).has('room')){try{showJoin(joinCodeFromInput(location.href))}catch(e){toast(e.message)}};if(document.modelContext?.registerTool){try{document.modelContext.registerTool({name:'artopia_status',description:'現在のアートピアの部屋・参加人数・描画設定を読み取ります。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({room:room?.name||null,connected,members:members.size,layer:prefs.layer+1,tool:prefs.tool,canvas:engine?{width:engine.w,height:engine.h}:null})});document.modelContext.registerTool({name:'artopia_open_room_creation',description:'部屋作成の設定画面を開きます。部屋の作成は確定しません。',inputSchema:{type:'object',properties:{},additionalProperties:false},execute:()=>{if(room)throw Error('部屋を退出してから操作してください');showCreate();return{opened:true}}})}catch{}}}
init();

let reconnectTimer=null,reconnectAttempts=0,reconnectController=null;
function scheduleReconnect(){if(!room||room.ended||isHost||reconnectAttempts>=5||connected)return;clearTimeout(reconnectTimer);reconnectTimer=setTimeout(reconnectSession,3000)}
async function reconnectSession(){
  if(!room||room.ended||connected||!peer||peer.destroyed||reconnectController)return;
  const token=sessionToken,hostId=hostConn?.peer,code=room.code,spectator=members.get(localId)?.spectator||false;
  if(!hostId)return;
  reconnectAttempts++;const controller=new AbortController();reconnectController=controller;
  try{
    await joinAttempt(peer,hostId,code,spectator,token,controller.signal,text=>{$('#connectionState').textContent='再接続：'+text});
    if(token!==sessionToken)return;
    reconnectAttempts=0;pendingOps.clear();redoIds=redoIds.filter(id=>engine.ops.some(a=>a.id===id));renderControls();toast('部屋に再接続しました');
  }catch(e){if(token===sessionToken&&!controller.signal.aborted)$('#connectionState').textContent=errorText(e)}
  finally{if(reconnectController===controller)reconnectController=null;if(token===sessionToken&&!connected)scheduleReconnect()}
}

</script></body></html>
